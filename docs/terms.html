        PayJoyDocs.setHTML(`s${number}-p${paragraphIndex + 1}`, paragraph.replaceAll("./support.html", PayJoyDocs.withLanguage("./support.html")));
      });
      if (section.list) {
        PayJoyDocs.setList(`s${number}-list`, section.list);
      }
    });
  </script>
</body>
</html>
